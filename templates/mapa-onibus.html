<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela para PDF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/sidebar-main.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/mapa-onibus.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/barra-rolagem.css') }}">
    <style>

    </style>
</head>

<body>
    <div class="main">

        <div class="sidebar">
            <a href="/">
                <div class="sidebar-item"><i class="bi bi-house-fill"></i></div>
            </a>
            <a href="/passageiros">
                <div class="sidebar-item"><i class="bi bi-person-fill"></i></div>
            </a>
            <a href="/viagens">
                <div class="sidebar-item"><i class="bi bi-airplane-fill"></i></div>
            </a>
            <a href="">
                <div class="sidebar-item"><i class="bi bi-credit-card-fill"></i></div>
            </a>
            <a href="" class="bell">
                <div class="sidebar-item"><i class="bi bi-bell-fill"></i></div>
            </a>
        </div>

        <div class="container">

            <div class="header">
                <div class="left">
                <button class="block" onclick="mapa()">
                    <i class="bi bi-border-all"></i>
                    <p>Mapa</p>
                </button>
                <button class="block" onclick="dados()">
                    <i class="bi bi-table"></i>
                    <p>Dados</p>
                </button>
            </div>
            <div class="right">
                <button class="toggle-btn-right" onclick="toggleSidebar(event)">+</button>
            </div>
            </div>
            
             {{mapa|safe}}

            {{dados|safe}}

        </div>

        <div class="sidebar-right" id="sidebarRight" onclick="event.stopPropagation()">
            <h2>Clientes</h2>
            <input type="text" class="search-box" id="searchInput" onkeyup="searchClient()"
                placeholder="Buscar nome...">
            <div class="clients-table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody">
                        {% for p in passageiros %}
                        <tr>
                            <td>{{ p.id }}</td>
                            <td draggable="true" class="drag-item" ondragstart="drag(event)">{{ p.nome }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>


        const allSeats = document.querySelectorAll('.nome');
        allSeats.forEach(assentos => {
            if (assentos.innerText != "") {
                assentos.style.backgroundColor = "red";
                assentos.style.color = "white";
                document.getElementById(`assento_${assentos.id}`).style.backgroundColor = "red";
                document.getElementById(`assento_${assentos.id}`).style.color = "white";
            }

        });


        function mapa() {
            document.getElementById("mapa-onibus").style.display = "block";
            document.querySelector(".tabela-dados").style.display = "none";
        }

        function dados() {
            document.getElementById("mapa-onibus").style.display = "none";
            document.querySelector(".tabela-dados").style.display = "block";
        }

        function toggleSidebar(event) {
            document.getElementById("mapa-onibus").classList.add("active");
            let sidebar = document.getElementById("sidebarRight");
            sidebar.classList.toggle("active");
            event.stopPropagation();

            if (sidebar.classList.contains("active")) {
                document.addEventListener("click", closeSidebar);
            } else {
                document.getElementById("mapa-onibus").classList.remove("active");
                document.removeEventListener("click", closeSidebar);
            }
        }

        function closeSidebar(event) {
            document.getElementById("mapa-onibus").classList.remove("active");
            let sidebar = document.getElementById("sidebarRight");
            if (!sidebar.contains(event.target)) {
                sidebar.classList.remove("active");
                document.removeEventListener("click", closeSidebar);
            }
        }

        function searchClient() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.querySelectorAll("#clientTableBody tr");

            rows.forEach(row => {
                let name = row.cells[1].textContent.toLowerCase();
                row.style.display = name.includes(input) ? "" : "none";
            });
        }

        function highlightSeat(seatId) {
            // Primeiro, removemos a classe 'selected' de todas as células e botões
            const allButtons = document.querySelectorAll('.nome');
            const allSeats = document.querySelectorAll('.assento');

            allButtons.forEach(button => {
                button.classList.remove('selected')
                if (button.innerText != "") {
                    button.style.backgroundColor = "red";
                    button.style.color = "white";
                    document.getElementById(`assento_${button.id}`).style.backgroundColor = "red";
                } else {
                    button.style.backgroundColor = "rgb(115, 187, 67)";
                    button.style.color = "black";
                }

            });
            allSeats.forEach(seat => {
                seat.classList.remove('selected')
                if (seat.style.backgroundColor == "red" || seat.style.backgroundColor == "#4CAF51") {
                    seat.style.backgroundColor = "red";
                    seat.style.color = "white";
                } else {
                    seat.style.backgroundColor = "rgb(115, 187, 67)";
                    seat.style.color = "black";
                }
            });

            // Adicionamos a classe 'selected' ao botão clicado e à célula de assento correspondente
            const button = document.getElementById(seatId);
            const seat = document.getElementById(`assento_${seatId}`);

            if (button) {
                if (button.classList.contains('selected')) {
                    button.classList.remove('selected');
                } else {
                    button.classList.add('selected');
                    button.style.backgroundColor = "#4CAF50";
                    button.style.color = "white";

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Delete' && button.classList.contains('selected')) {
                            button.innerHTML = ''; // Apaga o conteúdo do bloco
                        }
                    });

                    document.addEventListener('click', (e) => {
                        // Verifica se o clique foi fora do bloco de texto
                        if (!button.contains(e.target)) {
                            button.classList.remove('selected')
                            if (button.innerText != "") {
                                button.style.backgroundColor = "red";
                                button.style.color = "white";
                                document.getElementById(`assento_${button.id}`).style.backgroundColor = "red";
                            } else {
                                button.style.backgroundColor = "rgb(115, 187, 67)";
                                button.style.color = "black";
                            }
                            seat.classList.remove('selected')
                            if (seat.style.backgroundColor == "red" || seat.style.backgroundColor == "#4CAF51") {
                                seat.style.backgroundColor = "red";
                                seat.style.color = "white";
                            } else {
                                seat.style.backgroundColor = "rgb(115, 187, 67)";
                                seat.style.color = "black";
                            }
                        }

                    });

                    seat.classList.add('selected');
                    seat.style.backgroundColor = "#4CAF51";
                    seat.style.color = "white";
                }
            }

        }

        function drag(event) {
            event.dataTransfer.setData("text", event.target.innerText);
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function drop(event) {
            event.preventDefault();
            let name = event.dataTransfer.getData("text");
            if (event.target.classList.contains("nome")) {
                if (document.getElementById(event.target.id).innerText != "") {
                    confirm("Assento já ocupado!\nDeseja trocar?") ? event.target.innerText = name : event.target.innerText = event.target.innerText;
                } else {
                    event.target.style.backgroundColor = "red";
                    event.target.style.color = "white";
                } document.getElementById(event.target.id).style.backgroundColor = "red";
                document.getElementById(event.target.id).style.color = "white";
                document.getElementById(`assento_${event.target.id}`).style.backgroundColor = "red";
                document.getElementById(`assento_${event.target.id}`).style.color = "white";
                //document.getElementById(`assento_${event.target.id}`).style.backgroundColor = "red";
                //document.getElementById(`assento_${event.target.id}`).style.color = "white";
                event.target.innerText = name;

            }
        }


    </script>
</body>

</html>
